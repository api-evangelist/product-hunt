apis:
- aid: product-hunt:product-hunt-api
  name: Product Hunt API
  tags:
  - Product Discovery
  - Startups
  - Tech Products
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  baseURL: https://api.producthunt.com/v2
  humanURL: https://api.producthunt.com/v2/docs
  properties:
  - url: https://api.producthunt.com/v2/docs
    type: Documentation
  - url: https://www.producthunt.com/v2/oauth/applications
    type: Authentication
  - url: https://api.producthunt.com/v2/docs#section/Getting-Started/Rate-Limiting
    type: RateLimits
  description: >-
    The Product Hunt API provides programmatic access to Product Hunt's platform
    data via GraphQL. Developers can query and retrieve information about products,
    posts, topics, collections, users, votes, and comments. The API supports
    OAuth 2.0 authentication and allows applications to interact with the Product
    Hunt community, fetch daily product launches, explore trending tech products,
    and integrate Product Hunt data into third-party applications.
